name: Testes

# Testes automaticos da camada penal, do pipeline [motor simulado] e da
# integracao com o Ollama [servidor simulado]. Rodam em Linux e Windows.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Rodar os testes
        run: python -m pytest -q tests
