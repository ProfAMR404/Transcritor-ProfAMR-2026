[package]
name = "transcritor-profamr"
version = "0.1.0"
description = "Transcritor de audiencias penais, offline"
authors = ["Alexandre Morais da Rosa (ProfAMR)"]
edition = "2021"

[lib]
name = "transcritor_profamr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
