[project]
name = "transcritor-profamr"
version = "0.2.0"
description = "Transcricao de audiencias penais em portugues, offline, com camada penal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Alexandre Morais da Rosa (ProfAMR)" }]

# Nucleo/demo/GUI nao exigem dependencias externas.
# O motor de transcricao real (CPU ou GPU) e um extra opcional:
[project.optional-dependencies]
cpu = ["faster-whisper>=1.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
transcritor = "transcritor.cli:main"

[project.gui-scripts]
transcritor-gui = "transcritor.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["transcritor"]
